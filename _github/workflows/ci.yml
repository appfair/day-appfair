# {{title}}'s CI: every target the app declares, and its walkthrough in every language it ships
# (https://daybrite.dev/docs/how-to/github-actions). The shared Day workflow does the work.
#
# Runs on a push and a pull request. The App Fair queue rebuilds the app from its tag when it
# publishes, so a timer would catch nothing.
name: "{{repo}}"

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  # Marking a staged release Latest (see `release-mode` below) rebuilds the site against it.
  release:
    types: [released]
  workflow_dispatch:

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  # The catalog's rules: the license text, the license notice in every source file, the flavor
  # manifest holding the ids this app publishes under, and the App Fair group in the app's
  # settings (day-piece-appfair). The submission checks run the same action
  # (github.com/appfair/appfair-apps).
  appfair-lint:
    name: appfair-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main

  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release assets on a tag build
      pages: write    # web-dom → GitHub Pages (deploy-web)
      id-token: write # deploy-pages OIDC token (deploy-web)
    secrets: inherit
    with:
      # Every target Day.toml declares (`[app] targets`), so `day project add-target` reaches CI
      # on its own. To refine what CI builds, add or remove targets in Day.toml, or name the CI
      # targets here instead:
      #   targets: macos-appkit, windows-winui, linux-gtk, ios-uikit, android-material, web-dom
      targets: all
      # Release tags preserve the checked-in crates.io lock and use its released Day CLI.
      day-deps: $\{{ startsWith(github.ref, 'refs/tags/') && 'release' || 'auto' }}
      # Every dayscript under dayscript/ (`scripts: auto`), on every target, in every locale the
      # app ships (resource/locales/) and both appearances: a string that breaks only in one
      # language, or a layout that breaks only in dark mode, breaks the build.
      scripts: auto
      locales: all
      themes: light dark
      # Before any target builds, one runner checks formatting, runs Clippy with every warning
      # an error (the `[lints.clippy]` table in Cargo.toml says which lints are on), and runs
      # the tests.
      preflight-checks: fmt, clippy, test
      # Android captures on a 9:16 phone rather than the default 20:9 one: Google Play takes a
      # screenshot whose long side is at most twice its short, and the listing's screenshots
      # are these captures. The tablet is the default.
      android-devices: |
        device=pixel,          os=36, orientation=portrait,  slug=phone
        device=Nexus 7 2013,  os=36, orientation=landscape, density=240, slug=tablet
        device=medium_phone,   os=24, optional=true
      # A tagged build attaches its packages to the release. The App Fair queue rebuilds the app
      # from that tag under the ids in Day-appfair.toml and compares the two, so leave them on.
      release-assets: true
      # A tag publishes a pre-release, so releases/latest and the site's download links keep
      # describing the version before it until this one is approved. Marking the release Latest,
      # which the App Fair's queue does once its signed packages are attached, fires the
      # `release: released` event above and rebuilds the site against the new version.
      release-mode: pre-release
      # The web build serves from this repository's Pages (https://<owner>.github.io/<repo>/),
      # reusing the dist the web-dom leg produced, on a push to the default branch. Set
      # Settings → Pages → Source to GitHub Actions once, and add a `v*` tag rule to the
      # github-pages environment, or a tag build cannot deploy (README, "One-time repository
      # setup"). website/site.toml makes this the full project site (landing page, gallery,
      # downloads), with the app under /webapp/; without that file only the web build deploys.
      # Scaffolded as `false` when web-dom is not a target.
      deploy-web: {{deploy_web}}
