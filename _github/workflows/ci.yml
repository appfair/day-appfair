# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
#
# {{title}}'s CI: every target the app declares, and its walkthrough in every language it ships
# (https://daybrite.dev/docs/ci). The shared Day workflow does the work.
#
# Runs on a push and a pull request. The App Fair queue rebuilds the app from its tag when it
# publishes, so a timer would catch nothing.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # release assets on a tag build
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  # The catalog's rules: the licence texts, the licence notice in every source file, and the
  # flavor manifest holding the ids this app publishes under. The submission checks run the same
  # action (github.com/appfair/appfair-apps).
  appfair-lint:
    name: appfair-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main

  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      # The targets this app was scaffolded with. Add one with `day project add-target`, and
      # add it here too.
      targets: "{{targets_list}}"
      day-version: main
      # The walkthrough beside the app, per locale and per theme, so a string that breaks only
      # in French breaks the build.
      scripts: dayscript/demo.yaml
      # Every locale the app ships (resource/locales/), so `day localize add` reaches CI too.
      locales: all
      themes: light dark
      # On a tag, the App Fair identity (Day-appfair.toml) gets a leg per target: that is the
      # build the publishing queue rebuilds. An ordinary push builds the base app alone, and
      # appfair-lint checks the flavor's ids on every one. Release assets, Pages and the store
      # uploads stay with the base build.
      flavors: ${{ startsWith(github.ref, 'refs/tags/v') && 'appfair' || '' }}
      # A tagged build attaches its packages to the release. The App Fair queue compares its
      # own build against these, so leave them on.
      release-assets: true
      # The web build serves from this repository's Pages (https://<owner>.github.io/<repo>/),
      # reusing the dist the web-dom leg produced, on a push to the default branch. Set
      # Settings → Pages → Source to GitHub Actions once. A website/site.toml turns this into
      # the full project site, with the app under /webapp/.
      deploy-web: true
