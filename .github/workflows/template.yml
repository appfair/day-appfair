# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
#
# Scaffolds an app from this checkout and puts it through the workflow every Day app uses: eight
# targets, both languages, both appearances, and each platform's packaging.
#
# A push to the default branch publishes the generated app's web build to this repository's Pages,
# https://appfair.github.io/day-appfair/.
name: template

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # the generated app's web-dom build → this repository's Pages
  id-token: write # the OIDC token deploy-pages exchanges

jobs:
  # The licences, the SPDX notices and the dot-directory conventions: seconds on one runner,
  # before the matrix below spends an hour.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Install the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # The framework this template is written against; `latest` may predate its conventions.
          version: main

      - name: Scaffold an app from this template
        run: |
          set -euo pipefail
          "$DAY_BIN" new app fair-starter --template template --no-input \
            --appid io.github.fair_starter --git \
            --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
          ls -la fair-starter

      - name: Run day lint
        working-directory: fair-starter
        run: |
          "$DAY_BIN" lint

      # dayapp.yml skips its Rust preflight for a generated project, so rustfmt runs here. It
      # needs no dependencies and costs a second.
      - name: Check the formatting
        working-directory: fair-starter
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Check the licences and SPDX headers
        working-directory: fair-starter
        run: |
          set -euo pipefail
          test -s LICENSE.txt
          test -s LICENSE-EXCEPTIONS.txt
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE.txt
          grep -q 'APP FAIR DISTRIBUTION EXCEPTION' LICENSE-EXCEPTIONS.txt
          missing=0
          while IFS= read -r file; do
            head -3 "$file" \
              | grep -q 'SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception' \
              || { echo "::error file=$file::no SPDX header"; missing=1; }
          done < <(find src build.rs dayscript .github resource/locales store -type f \
                     \( -name '*.rs' -o -name '*.yaml' -o -name '*.yml' -o -name '*.ftl' -o -name '*.toml' \))
          test "$missing" -eq 0

      # The catalog's rules, against the app this template produced: the action a scaffolded app
      # runs on every push.
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main
        with:
          path: fair-starter

      - name: Check the app ids
        working-directory: fair-starter
        run: |
          set -euo pipefail
          # Day.toml holds the app's own id; Day-appfair.toml the ids the catalog publishes
          # under, which Play and HarmonyOS take without a hyphen.
          grep -qF 'id = "io.github.fair_starter"' Day.toml
          grep -qF 'id = "org.appfair.app.fair-starter"' Day-appfair.toml
          test "$(grep -c 'id = "org.appfair.app.fair_starter"' Day-appfair.toml)" = 2

      - name: Check the scaffolded files
        working-directory: fair-starter
        run: |
          set -euo pipefail
          # The app's workflow, not this repository's, and both languages in the catalog and the
          # store listing.
          test -f .github/workflows/ci.yml
          test ! -e .github/workflows/template.yml
          test ! -e .github/README.md
          test -s resource/locales/en/app.ftl
          test -s resource/locales/fr/app.ftl
          test -s store/fr/description.txt

  # The generated app, through the workflow every Day app uses. `setup-command` scaffolds it and
  # marks the project generated, which skips the preflight, the dependency update and the
  # pristine check.
  app:
    name: app
    needs: checks
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    with:
      # The eight primary targets.
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      project-path: fair-starter
      # `--template .` is this checkout; the command runs at the repository root.
      setup-command: >-
        day new app fair-starter --template . --no-input
        --appid io.github.fair_starter --git
        --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
      # The walkthrough the template ships, run in both languages and both appearances.
      scripts: dayscript/demo.yaml
      locales: en fr
      themes: light dark
      # The template publishes no packages: an app scaffolded from it does that.
      release-assets: false
      publish-release: false
      upload-ios: "false"
      upload-macos: "false"
      upload-play: "false"
      # The web-dom build, served from https://appfair.github.io/day-appfair/. It reuses the dist
      # the build job produced and deploys on a push to the default branch, once every target has
      # passed.
      deploy-web: true
