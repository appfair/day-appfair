# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
#
# The template, checked the way a user meets it: scaffold an app from this checkout, then put
# that app through the workflow every Day app uses. Eight primary targets, both languages,
# both appearances, and the packaging each platform does.
#
# A push to the default branch also publishes the generated app's web build to this repository's
# Pages, so https://appfair.github.io/day-appfair/ is what the template currently produces.
name: template

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # the generated app's web-dom build → this repository's Pages
  id-token: write # the OIDC token deploy-pages exchanges

jobs:
  # What only a template can get wrong: the licenses, the SPDX notices, and the dot-directory
  # conventions. Seconds on one runner, before the matrix below spends an hour.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Install the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # The framework the template is written against. `latest` would test this checkout
          # against a published CLI that may not carry the conventions it uses.
          version: main

      - name: Scaffold an app from this template
        run: |
          set -euo pipefail
          "$DAY_BIN" new app fair-starter --template template --no-input \
            --appid org.appfair.app.fairstarter --git \
            --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
          ls -la fair-starter

      - name: It is a valid Day project
        working-directory: fair-starter
        run: |
          "$DAY_BIN" lint

      - name: It carries its licenses, and every source file says so
        working-directory: fair-starter
        run: |
          set -euo pipefail
          test -s LICENSE.txt
          test -s LICENSE-EXCEPTIONS.txt
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE.txt
          grep -q 'APP FAIR DISTRIBUTION EXCEPTION' LICENSE-EXCEPTIONS.txt
          missing=0
          while IFS= read -r file; do
            head -3 "$file" \
              | grep -q 'SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception' \
              || { echo "::error file=$file::no SPDX header"; missing=1; }
          done < <(find src build.rs dayscript .github resource/locales store -type f \
                     \( -name '*.rs' -o -name '*.yaml' -o -name '*.yml' -o -name '*.ftl' -o -name '*.toml' \))
          test "$missing" -eq 0

      - name: The app's own workflow arrived, and this repository's did not
        working-directory: fair-starter
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test ! -e .github/workflows/template.yml
          test ! -e .github/README.md
          # Both languages travel with the app, in the catalog and in the store listing.
          test -s resource/locales/en/app.ftl
          test -s resource/locales/fr/app.ftl
          test -s store/fr/description.txt

  # The generated app, through the workflow every Day app uses. `setup-command` scaffolds the
  # project and marks it generated, which skips the Rust preflight, the dependency update, and
  # the pristine check.
  app:
    name: app
    needs: checks
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    with:
      # The eight primary targets.
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      project-path: fair-starter
      # `--template .` is this checkout: the setup command runs at the repository root.
      setup-command: >-
        day new app fair-starter --template . --no-input
        --appid org.appfair.app.fairstarter --git
        --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
      # The walkthrough the template ships, run in both languages and both appearances.
      scripts: dayscript/demo.yaml
      locales: en fr
      themes: light dark
      # The template publishes no packages: an app scaffolded from it does that.
      release-assets: false
      publish-release: false
      upload-ios: "false"
      upload-macos: "false"
      upload-play: "false"
      # The web-dom build, served from https://appfair.github.io/day-appfair/ so the template's
      # output can be opened rather than described. It reuses the dist the build job already
      # produced, and deploys on a push to the default branch once every target has passed.
      deploy-web: true
