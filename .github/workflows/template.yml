# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
#
# Scaffolds an app from this checkout and puts it through the workflow every Day app uses: eight
# targets, both languages, both appearances, and each platform's packaging.
#
# A push to the default branch publishes the generated app's web build to this repository's Pages,
# https://appfair.github.io/day-appfair/.
name: template

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # the generated app's web-dom build → this repository's Pages
  id-token: write # the OIDC token deploy-pages exchanges

jobs:
  # The licences, the SPDX notices and the dot-directory conventions: seconds on one runner,
  # before the matrix below spends an hour.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Install the day CLI
        uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          # The framework this template is written against; `latest` may predate its conventions.
          version: main

      - name: Scaffold an app from this template
        run: |
          set -euo pipefail
          "$DAY_BIN" new app fair-starter --template template --no-input \
            --appid io.github.fair_starter --git \
            --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
          ls -la fair-starter

      - name: Run day lint
        working-directory: fair-starter
        run: |
          "$DAY_BIN" lint

      # dayapp.yml skips its Rust preflight for a generated project, so rustfmt runs here. It
      # needs no dependencies and costs a second.
      - name: Check the formatting
        working-directory: fair-starter
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Check the licences and SPDX headers
        working-directory: fair-starter
        run: |
          set -euo pipefail
          # `check <what> <command…>` runs every test and names each one that fails, in the log
          # and as an annotation, rather than stopping at a silent `grep -q` with exit code 1.
          failed=0
          check() {
            local what="$1"; shift
            if ! "$@"; then
              echo "::error title=${what//:/%3A}::${PWD##*/}: $* failed"
              failed=1
            fi
          }
          check "the licence" test -s LICENSE.txt
          check "the licence exception" test -s LICENSE-EXCEPTIONS.txt
          check "the licence is the AGPL" grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE.txt
          check "the exception is the App Fair's" grep -q 'APP FAIR DISTRIBUTION EXCEPTION' LICENSE-EXCEPTIONS.txt
          missing=0
          while IFS= read -r file; do
            head -3 "$file" \
              | grep -q 'SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception' \
              || { echo "::error file=$file::no SPDX header"; missing=1; }
          done < <(find src build.rs dayscript .github resource/locales store -type f \
                     \( -name '*.rs' -o -name '*.yaml' -o -name '*.yml' -o -name '*.ftl' -o -name '*.toml' \))
          check "every source file carries the SPDX header" test "$missing" -eq 0
          exit "$failed"

      # The catalog's rules, against the app this template produced: the action a scaffolded app
      # runs on every push.
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main
        with:
          path: fair-starter

      - name: Check the app ids
        working-directory: fair-starter
        run: |
          set -euo pipefail
          # `check <what> <command…>` runs every test and names each one that fails, in the log
          # and as an annotation, rather than stopping at a silent `grep -q` with exit code 1.
          failed=0
          check() {
            local what="$1"; shift
            if ! "$@"; then
              echo "::error title=${what//:/%3A}::${PWD##*/}: $* failed"
              failed=1
            fi
          }
          # Day.toml holds the app's own id; Day-appfair.toml the ids the catalog publishes
          # under, which Play and HarmonyOS take without a hyphen.
          check "Day.toml has the app's own id" grep -qF 'id = "io.github.fair_starter"' Day.toml
          check "Day-appfair.toml has the catalog id" grep -qF 'id = "org.appfair.app.fair-starter"' Day-appfair.toml
          check "Day-appfair.toml has the underscore id twice (Play, HarmonyOS)" \
            test "$(grep -c 'id = "org.appfair.app.fair_starter"' Day-appfair.toml)" = 2
          exit "$failed"

      - name: Check the scaffolded files
        working-directory: fair-starter
        run: |
          set -euo pipefail
          # `check <what> <command…>` runs every test and names each one that fails, in the log
          # and as an annotation, rather than stopping at a silent `grep -q` with exit code 1.
          failed=0
          check() {
            local what="$1"; shift
            if ! "$@"; then
              echo "::error title=${what//:/%3A}::${PWD##*/}: $* failed"
              failed=1
            fi
          }
          # The app's workflow, not this repository's, and both languages in the catalog.
          check "the app's own workflow" test -f .github/workflows/ci.yml
          check "not this repository's workflow" test ! -e .github/workflows/template.yml
          check "not this repository's README" test ! -e .github/README.md
          check "the English catalog" test -s resource/locales/en/app.ftl
          check "the French catalog" test -s resource/locales/fr/app.ftl
          # …and both in the store listing. Asked of the CLI rather than of a file, so the check
          # holds however the listing is laid out (one storefront.toml today, a file per field
          # before): each locale resolves a description of its own, placeholders filled in.
          "$DAY_BIN" store export --out "$RUNNER_TEMP/storefront.json"
          check "the store listing has an English and a French description" python3 - "$RUNNER_TEMP/storefront.json" <<'PY'
          import json, sys
          meta = json.load(open(sys.argv[1]))["storefront"]["metadata"]
          text = {tag: meta.get(tag, {}).get("description", "") for tag in ("en", "fr")}
          problems = [f"{tag}: no description" for tag, d in text.items() if not d.strip()]
          problems += [f"{tag}: an unfilled placeholder" for tag, d in text.items() if "{{" in d]
          if text["en"] and text["en"] == text["fr"]:
              problems.append("fr: the same text as en")
          for p in problems:
              print(p)
          if problems:
              print(f"the listing's locales: {', '.join(sorted(meta)) or 'none'}")
          sys.exit(1 if problems else 0)
          PY
          exit "$failed"

      # Whatever failed above, the scaffold as it came out, so the log alone says what was there:
      # the CLI that made it, its file tree, and the manifests the checks read.
      - name: Show the scaffold (on failure)
        if: failure()
        working-directory: fair-starter
        run: |
          echo "::group::day version"; "$DAY_BIN" version || true; echo "::endgroup::"
          echo "::group::the file tree"
          find . \( -name .git -o -name target -o -name build \) -prune -o -type f -print | sort
          echo "::endgroup::"
          for f in Day.toml Day-appfair.toml store/storefront.toml store/storefront.yaml; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  # The generated app, through the workflow every Day app uses. `setup-command` scaffolds it and
  # marks the project generated, which skips the preflight, the dependency update and the
  # pristine check.
  app:
    name: app
    needs: checks
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    with:
      # The eight primary targets.
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      project-path: fair-starter
      # `--template .` is this checkout; the command runs at the repository root.
      setup-command: >-
        day new app fair-starter --template . --no-input
        --appid io.github.fair_starter --git
        --toolkit windows-xaml,macos-appkit,linux-gtk,linux-qt,ios-uikit,android-mdc,harmony-arkui,web-dom
      # The walkthrough the template ships, run in both languages and both appearances.
      scripts: dayscript/demo.yaml
      locales: en fr
      themes: light dark
      # The template publishes no packages: an app scaffolded from it does that.
      release-assets: false
      publish-release: false
      upload-ios: "false"
      upload-macos: "false"
      upload-play: "false"
      # The web-dom build, served from https://appfair.github.io/day-appfair/. It reuses the dist
      # the build job produced and deploys on a push to the default branch, once every target has
      # passed.
      deploy-web: true
