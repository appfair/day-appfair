# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
#
# The App Fair build of this app (https://daybrite.dev/docs/flavors). `day --flavor appfair …`
# merges this over Day.toml, and the catalog (github.com/appfair/appfair-apps) builds, signs and
# submits every release that way. Only the ids differ; Day.toml keeps the app's own.

[app]
id = "org.appfair.app.{{repo}}"

# A Play package name takes no hyphen, so the token travels with underscores.
[app.android]
id = "org.appfair.app.{{ident}}"

# HarmonyOS refuses a hyphen in `bundleName` too, so the underscore form again.
[app.harmony]
id = "org.appfair.app.{{ident}}"
