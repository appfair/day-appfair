# The Day project manifest (https://daybrite.dev/docs/cli). `name`/`version` come from
# Cargo.toml; any [app] property may be overridden per platform, toolkit, or target.
schema = 1

[app]
id = "{{id}}"
title = "{{title}}"
build = 1
targets = [{{targets_toml}}]

# The window's geometry in points (https://daybrite.dev/docs/size-classes). `day build` carries
# all four into the Android manifest's <layout> element and the iOS Info.plist.
[window]
width = 960
height = 640
min_width = 320
min_height = 400
